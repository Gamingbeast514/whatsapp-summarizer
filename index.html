<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Chat Summarizer</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #10b981;
      --accent-hover: #059669;
      --blue: #3b82f6;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.9rem;
      color: #ffffff;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #e5e7eb;
    }

    input[type="password"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: #0f172a;
      color: var(--muted);
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    .dropzone {
      border: 2px dashed #334155;
      border-radius: 10px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #0f172a;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.08);
    }

    .dropzone p {
      margin: 4px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .file-info {
      margin-top: 10px;
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #052e16;
      font-weight: 700;
      font-size: 0.98rem;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      width: auto;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-secondary:hover:not(:disabled) { background: #334155; }

    .error-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.9rem;
      display: none;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .output-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: #ffffff;
      margin-top: 1.2em;
      margin-bottom: 0.5em;
    }

    .markdown-body h2 {
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9rem;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid #334155;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    .markdown-body th {
      background: #1e293b;
    }

    .markdown-body code {
      background: #1e293b;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.88em;
    }

    @media print {
      body {
        background: #ffffff;
        color: #111827;
        padding: 0;
      }
      header, #input-card, .output-actions, .no-print {
        display: none !important;
      }
      .card {
        border: none;
        background: #ffffff;
        padding: 0;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        color: #0f172a;
      }
      .markdown-body th {
        background: #f1f5f9;
        color: #0f172a;
      }
      .markdown-body th, .markdown-body td {
        border-color: #cbd5e1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>WhatsApp Chat Summarizer</h1>
      <p>Upload a WhatsApp export (<code>.txt</code> or <code>.zip</code>) or paste chat text to generate an instant summary &amp; PDF.</p>
    </header>

    <div class="card" id="input-card">
      <div class="row">
        <div>
          <label for="model">AI Model</label>
          <select id="model">
            <option value="gemini-2.5-flash">Gemini 2.5 Flash (Fast &amp; Recommended)</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro (Detailed)</option>
            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          </select>
        </div>
        <div>
          <label for="style">Summary Format</label>
          <select id="style">
            <option value="executive">Executive &amp; Project Summary (Structured)</option>
            <option value="actions">Action Items, Decisions &amp; Open Issues</option>
            <option value="timeline">Chronological Timeline</option>
            <option value="custom">Custom Instructions</option>
          </select>
        </div>
      </div>

      <div id="customPromptWrap" style="display: none; margin-bottom: 14px;">
        <label for="customPrompt">Custom Instructions</label>
        <input type="text" id="customPrompt" placeholder="e.g., Summarize only bug reports and deadlines" />
      </div>

      <div id="pinWrap" style="display: none; margin-bottom: 14px;">
        <label for="accessPin">Access PIN</label>
        <input type="password" id="accessPin" placeholder="Enter access PIN" />
      </div>

      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabFile">Upload .txt / .zip</button>
        <button type="button" class="tab-btn" id="tabPaste">Paste Chat Text</button>
      </div>

      <div id="fileSection">
        <div class="dropzone" id="dropzone">
          <p><strong>Click to choose a file</strong> or drag &amp; drop here</p>
          <p>Supports WhatsApp <code>.txt</code> or <code>.zip</code> exports</p>
          <input type="file" id="fileInput" accept=".txt,.zip" style="display: none;" />
          <div class="file-info" id="fileInfo"></div>
        </div>
      </div>

      <div id="pasteSection" style="display: none;">
        <textarea id="pasteInput" rows="8" placeholder="Paste your WhatsApp chat export here..."></textarea>
      </div>

      <div style="margin-top: 16px;">
        <button type="button" class="btn" id="summarizeBtn">Generate Summary</button>
      </div>

      <div class="error-box" id="errorBox"></div>
    </div>

    <div class="card" id="outputCard" style="display: none;">
      <div class="output-header">
        <strong style="font-size: 1.1rem;">Generated Summary</strong>
        <div class="output-actions">
          <button type="button" class="btn btn-secondary" id="copyBtn">Copy Markdown</button>
          <button type="button" class="btn btn-secondary" id="downloadMdBtn">Download .md</button>
          <button type="button" class="btn btn-secondary" id="printPdfBtn">Save as PDF</button>
        </div>
      </div>
      <div class="markdown-body" id="outputBody"></div>
    </div>
  </div>

  <script>
    // Replace this with your deployed Cloudflare Worker URL:
    const WORKER_URL = 'https://whatsapp-summarizer.handsongames786110.workers.dev';

    const modelEl = document.getElementById('model');
    const styleEl = document.getElementById('style');
    const customPromptWrap = document.getElementById('customPromptWrap');
    const customPromptEl = document.getElementById('customPrompt');
    const pinWrap = document.getElementById('pinWrap');
    const accessPinEl = document.getElementById('accessPin');
    const tabFile = document.getElementById('tabFile');
    const tabPaste = document.getElementById('tabPaste');
    const fileSection = document.getElementById('fileSection');
    const pasteSection = document.getElementById('pasteSection');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const pasteInput = document.getElementById('pasteInput');
    const summarizeBtn = document.getElementById('summarizeBtn');
    const errorBox = document.getElementById('errorBox');
    const outputCard = document.getElementById('outputCard');
    const outputBody = document.getElementById('outputBody');

    let loadedChatText = '';
    let loadedFileName = 'whatsapp-summary';
    let lastMarkdown = '';
    let activeMode = 'file';

    styleEl.addEventListener('change', () => {
      customPromptWrap.style.display = styleEl.value === 'custom' ? 'block' : 'none';
    });

    tabFile.addEventListener('click', () => {
      activeMode = 'file';
      tabFile.classList.add('active');
      tabPaste.classList.remove('active');
      fileSection.style.display = 'block';
      pasteSection.style.display = 'none';
    });

    tabPaste.addEventListener('click', () => {
      activeMode = 'paste';
      tabPaste.classList.add('active');
      tabFile.classList.remove('active');
      pasteSection.style.display = 'block';
      fileSection.style.display = 'none';
    });

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    async function handleFile(file) {
      hideError();
      loadedFileName = file.name.replace(/\.(txt|zip)$/i, '');
      try {
        if (file.name.toLowerCase().endsWith('.zip')) {
          const zip = await JSZip.loadAsync(file);
          const txtEntry = Object.values(zip.files).find(
            (f) => !f.dir && f.name.toLowerCase().endsWith('.txt')
          );
          if (!txtEntry) {
            throw new Error('No .txt chat file found inside the .zip archive.');
          }
          loadedChatText = await txtEntry.async('string');
          fileInfo.textContent = `Loaded "${txtEntry.name}" from ${file.name} (${loadedChatText.split('\n').length} lines)`;
        } else {
          loadedChatText = await file.text();
          fileInfo.textContent = `Loaded "${file.name}" (${loadedChatText.split('\n').length} lines)`;
        }
      } catch (err) {
        showError(err.message);
        loadedChatText = '';
        fileInfo.textContent = '';
      }
    }

    function getPromptInstruction() {
      const style = styleEl.value;
      if (style === 'executive') {
        return `Provide a clear, well-structured Markdown summary of this WhatsApp chat. Include:
1. **Overview** (participants, date range, overall purpose)
2. **Key Topics / Projects** (use bullet points or a Markdown table if multiple projects/tasks exist)
3. **Decisions, Action Items & Pending Issues**
4. **Notable Links, Files, or Personal/HR Updates**
Translate any Roman Urdu/Hindi into clear English while preserving exact names, dates, and technical terms.`;
      }
      if (style === 'actions') {
        return `Extract only the **Decisions Made**, **Action Items** (with owners if mentioned), and **Unresolved / Open Issues** from this WhatsApp chat in clean Markdown. Translate any Roman Urdu/Hindi into clear English.`;
      }
      if (style === 'timeline') {
        return `Create a concise **Chronological Timeline** of key events, deliverables, and discussions in this WhatsApp chat in Markdown. Translate any Roman Urdu/Hindi into clear English.`;
      }
      return customPromptEl.value.trim() || 'Summarize this WhatsApp chat clearly in Markdown.';
    }

    summarizeBtn.addEventListener('click', async () => {
      hideError();
      if (WORKER_URL.includes('YOUR-SUBDOMAIN')) {
        return showError('Backend Worker URL is not configured yet. Update WORKER_URL in index.html.');
      }

      const chatText = activeMode === 'file' ? loadedChatText : pasteInput.value.trim();
      if (!chatText) {
        return showError('Please upload a chat file or paste chat text first.');
      }

      summarizeBtn.disabled = true;
      summarizeBtn.textContent = 'Summarizing...';

      try {
        const model = modelEl.value;
        const instruction = getPromptInstruction();
        const headers = { 'Content-Type': 'application/json' };
        const pin = accessPinEl.value.trim();
        if (pin) headers['X-Access-Pin'] = pin;

        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers,
          body: JSON.stringify({
            model,
            prompt: `${instruction}\n\n---\nWHATSAPP CHAT:\n${chatText}`
          })
        });

        const data = await response.json();
        if (response.status === 401) {
          pinWrap.style.display = 'block';
          throw new Error(data.error || 'Access PIN required.');
        }
        if (!response.ok) {
          throw new Error(data.error?.message || data.error || `API Error (${response.status})`);
        }

        const markdown = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!markdown) {
          throw new Error('No summary returned by the model.');
        }

        lastMarkdown = markdown;
        outputBody.innerHTML = marked.parse(markdown);
        outputCard.style.display = 'block';
        outputCard.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        showError(err.message);
      } finally {
        summarizeBtn.disabled = false;
        summarizeBtn.textContent = 'Generate Summary';
      }
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(lastMarkdown);
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => (btn.textContent = 'Copy Markdown'), 1500);
    });

    document.getElementById('downloadMdBtn').addEventListener('click', () => {
      const blob = new Blob([lastMarkdown], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${loadedFileName}-summary.md`;
      a.click();
    });

    document.getElementById('printPdfBtn').addEventListener('click', () => {
      window.print();
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      errorBox.style.display = 'none';
    }
  </script>
</body>
</html>
